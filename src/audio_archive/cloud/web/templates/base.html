<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Audio Archive{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink:#171717; --muted:#666; --line:#ddd8cf; --paper:#fbfaf7; --panel:#fff; --accent:#315c4b; --warn:#8b5a19; --bad:#8b2e2e; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    header { border-bottom:1px solid var(--line); background:rgba(255,255,255,.85); }
    .shell { width:min(1120px, calc(100% - 32px)); margin:0 auto; }
    header .shell { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-family:Georgia, serif; font-size:22px; letter-spacing:.02em; }
    .identity { color:var(--muted); font-size:13px; }
    main { padding:36px 0 72px; }
    h1,h2,h3 { font-family:Georgia, serif; font-weight:500; margin-top:0; }
    h1 { font-size:36px; line-height:1.1; margin-bottom:10px; }
    h2 { font-size:23px; margin-bottom:16px; }
    .lede { color:var(--muted); max-width:720px; line-height:1.55; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:18px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; }
    .submit { grid-column:span 7; } .score { grid-column:span 5; }
    label { display:block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin:14px 0 6px; color:#4c4c4c; }
    input,select { width:100%; border:1px solid #cbc6bc; border-radius:8px; padding:11px 12px; background:#fff; color:var(--ink); font:inherit; }
    button,.button { appearance:none; display:inline-block; border:0; border-radius:8px; padding:10px 15px; background:var(--accent); color:white; font:600 14px/1.2 inherit; cursor:pointer; text-decoration:none; }
    .button.secondary,button.secondary { background:#ece9e2; color:var(--ink); }
    .button.danger,button.danger { background:var(--bad); }
    .actions { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:18px; }
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .stat { padding:14px; border:1px solid var(--line); border-radius:9px; }
    .stat strong { display:block; font:500 28px/1 Georgia, serif; } .stat span { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
    th,td { text-align:left; padding:12px 13px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
    tr:last-child td { border-bottom:0; }
    .status { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:4px 8px; font-size:11px; font-weight:700; background:#f6f4ef; }
    .status.failed { color:var(--bad); } .status.needs_review { color:var(--warn); } .status.ready_to_download { color:var(--accent); }
    .meta { color:var(--muted); font-size:13px; line-height:1.55; }
    .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; overflow-wrap:anywhere; }
    .candidate { border:1px solid var(--line); border-radius:10px; padding:16px; margin:12px 0; }
    .candidate h3 { font-size:18px; margin-bottom:6px; }
    .candidate .scoreline { font-weight:700; }
    .event { padding:12px 0; border-bottom:1px solid var(--line); } .event:last-child { border-bottom:0; }
    .output { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; }
    .output:last-child { border-bottom:0; }
    .notice { border-left:3px solid var(--warn); padding:10px 14px; background:#fff8ed; }
    @media (max-width:800px) { .submit,.score { grid-column:1/-1; } h1 { font-size:30px; } table { display:block; overflow-x:auto; } .output { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
<header><div class="shell"><a class="brand" href="/">Audio Archive</a><div class="identity">Private · {{ identity.email }}</div></div></header>
<main><div class="shell">{% block content %}{% endblock %}</div></main>
</body>
</html>
