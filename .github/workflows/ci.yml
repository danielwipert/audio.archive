name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Report optional FFmpeg integration tools
        run: |
          command -v ffmpeg || true
          command -v ffprobe || true

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --select E4,E7,E9,F src tests

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Require ASCII-safe Windows PowerShell scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          bad = []
          for path in Path("scripts").glob("*.ps1"):
              data = path.read_bytes()
              if any(byte > 0x7F for byte in data):
                  bad.append(str(path))

          if bad:
              raise SystemExit(
                  "Windows PowerShell 5.1 compatibility requires ASCII-only .ps1 files: "
                  + ", ".join(bad)
              )
          PY

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw $_.FullName))
          }

      - name: Test
        run: python -m pytest

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Validate scripts with Windows PowerShell
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw $_.FullName))
          }

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Test on Windows
        run: python -m pytest
