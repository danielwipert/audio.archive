name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audio_archive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audio_archive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLOUD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/audio_archive_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Report optional FFmpeg integration tools
        run: |
          command -v ffmpeg || true
          command -v ffprobe || true

      - name: Install project
        run: python -m pip install -e ".[dev,cloud]"

      - name: Ruff
        run: ruff check --select E4,E7,E9,F src tests

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Require ASCII-safe Windows PowerShell scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          bad = []
          for path in Path("scripts").glob("*.ps1"):
              data = path.read_bytes()
              if any(byte > 0x7F for byte in data):
                  bad.append(str(path))

          if bad:
              raise SystemExit(
                  "Windows PowerShell 5.1 compatibility requires ASCII-only .ps1 files: "
                  + ", ".join(bad)
              )
          PY

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw $_.FullName))
          }

      - name: Test
        run: python -m pytest

      - name: Build cloud production container
        run: docker build --tag audio-archive-cloud:ci .

      - name: Verify BgUtils runtime
        run: |
          docker run --rm --entrypoint /bin/sh audio-archive-cloud:ci -lc '
            set -eu
            server=/app/tools/bgutil-ytdlp-pot-provider/server
            cache=/home/audioarchive/.cache/bgutil-ytdlp-pot-provider
            test "$(id -u)" = "10001"
            deno --version | grep -q "^deno 2\.4\.3 "
            test "$(git -C /app/tools/bgutil-ytdlp-pot-provider describe --tags --exact-match)" = "1.3.2"
            test -r "$server/src/main.ts"
            test -w "$server/node_modules/.deno"
            unreadable="$(find "$server/node_modules" -type f -name package.json ! -readable -print -quit)"
            test -z "$unreadable"
            mkdir -p "$cache"
            deno run --allow-env --allow-net \
              --allow-ffi="$server/node_modules" \
              --allow-write="$cache" \
              --allow-read="$cache,$server/node_modules" \
              "$server/src/generate_once.ts" --version | grep -q "^1\.3\.2$"
          '

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,cloud]"

      - name: Validate scripts with Windows PowerShell
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw $_.FullName))
          }

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Test on Windows
        run: python -m pytest
