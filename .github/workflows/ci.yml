name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Report optional FFmpeg integration tools
        run: |
          command -v ffmpeg || true
          command -v ffprobe || true

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --select E4,E7,E9,F src tests

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Test
        run: python -m pytest
