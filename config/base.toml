[app]
host = "127.0.0.1"
port = 8765
open_browser = true
poll_interval_seconds = 2.0

[archive]
root = "archive"
temp_directory = "archive/temp"
safe_wav_size_gib = 1.8
segment_minutes = 60

[tools]
directory = "tools"
yt_dlp = "yt-dlp"
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
deno = "deno"
# "script" runs the BgUtils generator per request; "http" asks a long-lived
# BgUtils server that reuses the page yt-dlp already fetched.
pot_provider = "script"
pot_http_base_url = "http://127.0.0.1:4416"

[resolver]
candidate_limit = 5
auto_select_min_score = 90
auto_select_min_margin = 15

[input]
max_csv_bytes = 5242880

