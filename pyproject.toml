[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "audio-archive"
version = "0.1.0"
description = "Local, preservation-first YouTube audio ingestion for Ableton workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bgutil-ytdlp-pot-provider==1.3.1",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp[default]==2026.7.4",
]

[project.optional-dependencies]
cloud = [
  "boto3>=1.40,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
audio-archive = "audio_archive.cli:main"
audio-archive-cloud-migrate = "audio_archive.cloud.runtime:migrate_main"
audio-archive-cloud-web = "audio_archive.cloud.runtime:web_main"
audio-archive-cloud-worker = "audio_archive.cloud.runtime:worker_main"
audio-archive-cloud-cleanup = "audio_archive.cloud.runtime:cleanup_main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
